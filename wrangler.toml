name = "gezyujian"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = ""              # diisi saat `wrangler login`
workers_dev = true

# Custom domain dipasang manual via Dashboard (Workers → Settings → Domains & Routes)
# karena zone gezytech.web.id tidak ter-infer otomatis oleh wrangler

[[d1_databases]]
binding = "DB"
database_name = "gezyujian"
database_id = "1d82021c-2d1a-4f3e-99e8-03a0b088a3bb"

[vars]
APP_NAME = "GezyUjian"
SINKRON_REPO = "pakgun10/gezyujian"
SINKRON_FOLDER = "soal"

# Secret (jangan di-commit): ADMIN_TOKEN, GITHUB_READ_TOKEN (opsional, utk repo private)
# wrangler secret put ADMIN_TOKEN
# wrangler secret put GITHUB_READ_TOKEN
